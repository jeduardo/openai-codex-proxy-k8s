image:
  repository: ghcr.io/hotchpotch/openai-api-server-via-codex
  tag: latest
  pullPolicy: IfNotPresent

auth:
  existingSecret: codex-auth-bootstrap
  secretKey: auth.json

apiKey:
  existingSecret: codex-proxy-api-key
  secretKey: api-key

service:
  port: 18080

persistence:
  enabled: true
  size: 32Mi
  storageClassName: ""

networkPolicy:
  enabled: true
  clientLabel:
    key: openai-codex-proxy-client
    value: "true"
  gateway:
    enabled: false
    namespace: kube-system
    podSelector:
      matchLabels: {}

route:
  enabled: false
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
  hostname: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
