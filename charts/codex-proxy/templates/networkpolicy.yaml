{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.networkPolicy.gateway.enabled (not .Values.networkPolicy.gateway.podSelector.matchLabels) }}
{{- fail "networkPolicy.gateway.podSelector.matchLabels must be non-empty when gateway access is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "codex-proxy.fullname" . }}
  labels:
    {{- include "codex-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codex-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientLabel.key }}: {{ .Values.networkPolicy.clientLabel.value | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.gateway.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gateway.namespace }}
          podSelector:
            {{- toYaml .Values.networkPolicy.gateway.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
