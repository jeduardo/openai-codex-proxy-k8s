{{- if and .Values.apiKey.generate (not .Values.apiKey.existingSecret) }}
{{- $name := printf "%s-api-key" (include "codex-proxy.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "codex-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.apiKey.secretKey }}: {{ if $existing }}{{ index $existing.data .Values.apiKey.secretKey | quote }}{{ else }}{{ randBytes 32 | b64enc | quote }}{{ end }}
{{- end }}
