---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-codex-proxy
  namespace: ai
  labels:
    app.kubernetes.io/name: openai-codex-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openai-codex-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openai-codex-proxy
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-auth
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -s /data/auth.json ]; then
                if [ ! -s /bootstrap/auth.json ]; then
                  echo "No persisted auth.json or bootstrap credential found" >&2
                  exit 1
                fi
                rm -f /data/.auth.json.bootstrap.tmp
                cp /bootstrap/auth.json /data/.auth.json.bootstrap.tmp
                chmod 0600 /data/.auth.json.bootstrap.tmp
                chown 10001:10001 /data/.auth.json.bootstrap.tmp
                mv /data/.auth.json.bootstrap.tmp /data/auth.json
              fi
              chown 0:0 /data/auth.json
              chmod 0600 /data/auth.json
              chown 10001:10001 /data/auth.json
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: auth-data
              mountPath: /data
            - name: auth-bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: proxy
          image: ghcr.io/jeduardo/openai-codex-proxy-k8s:main
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_VIA_CODEX_AUTH_JSON
              value: /var/lib/codex/auth.json
            - name: OPENAI_VIA_CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-proxy-api-key
                  key: api-key
          ports:
            - name: http
              containerPort: 18080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth-data
              mountPath: /var/lib/codex
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth-data
          persistentVolumeClaim:
            claimName: codex-auth
        - name: auth-bootstrap
          secret:
            secretName: codex-auth-bootstrap
            optional: true
        - name: tmp
          emptyDir: {}
