---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openai-codex-proxy
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openai-codex-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              openai-codex-proxy-client: "true"
      ports:
        - protocol: TCP
          port: 18080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
