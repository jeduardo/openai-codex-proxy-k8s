---
name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation tools
        run: |
          set -euo pipefail
          helm_sha256=fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "$helm_sha256  /tmp/helm.tar.gz" | sha256sum --check --status
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          kubeconform_sha256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          echo "$kubeconform_sha256  /tmp/kubeconform.tar.gz" | sha256sum --check --status
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Verify repository
        run: ./scripts/verify.sh
